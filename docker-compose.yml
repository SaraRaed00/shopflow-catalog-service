services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: shopflow
      MYSQL_USER: shopflow
      MYSQL_PASSWORD: shopflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  mysql_data:
