
services:
    mysql:
        image: mysql:8
        environment:
            MYSQL_DATABASE: shopflow
            MYSQL_USER: shopflow
            MYSQL_PASSWORD: shopflow
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "6380:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        environment:
            DB_URL: jdbc:mysql://mysql:3306/shopflow
            DB_USERNAME: shopflow
            DB_PASSWORD: shopflow
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    mysql_data:
