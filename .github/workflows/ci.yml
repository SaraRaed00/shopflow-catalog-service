name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8
                env:
                    MYSQL_DATABASE: shopflow
                    MYSQL_USER: shopflow
                    MYSQL_PASSWORD: shopflow
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

            redis:
                image: redis:7-alpine
                ports:
                    - 6380:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: maven

            - name: Run tests and build
              run: ./mvnw -B clean verify

            - name: Upload JaCoCo coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: jacoco-report
                  path: target/site/jacoco/

            - name: Build Docker image
              run: docker build -t catalog-service:ci .
