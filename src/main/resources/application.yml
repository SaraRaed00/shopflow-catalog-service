spring:
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/shopflow}
        username: ${DB_USERNAME:shopflow}
        password: ${DB_PASSWORD:shopflow}
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6380}
    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: true
cache:
    ttl:
        default-minutes: 10
        category-tree-hours: 6
logging:
    level:
        org.hibernate.SQL: debug
server:
    port: 8080
ratelimit:
    reservations:
        limit: 10
        window-seconds: 60
management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics, prometheus
    endpoint:
        health:
            show-details: when_authorized
    metrics:
        tags:
            application: catalog-service
